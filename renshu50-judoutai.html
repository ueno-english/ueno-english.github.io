<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小テスト練習50問｜上野作 英語復習活用ホームページ</title>
  <style>
    :root {
      --blue:  #b5006e;
      --red:   #c0392b;
      --green: #1a7a1a;
      --gold:  #d4700a;
      --bg:    #fff0f6;
      --card:  #ffffff;
      --border:#f5c6df;
      --text:  #222;
      --sub:   #555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Hiragino Sans", "Meiryo", sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.7; }
    header { background: linear-gradient(135deg, #7b003d 0%, #e91e8c 100%); color: white; padding: 20px 16px 16px; text-align: center; }
    header .lesson-label { font-size: 12px; letter-spacing: 2px; opacity: 0.85; margin-bottom: 4px; }
    header h1 { font-size: 20px; font-weight: bold; margin-bottom: 6px; }
    header .topics { font-size: 12px; opacity: 0.9; background: rgba(255,255,255,0.15); border-radius: 20px; padding: 4px 14px; display: inline-block; }
    nav { display: flex; overflow-x: auto; gap: 8px; padding: 12px 16px; background: white; border-bottom: 1px solid var(--border); }
    nav a { white-space: nowrap; text-decoration: none; background: var(--blue); color: white; padding: 6px 14px; border-radius: 20px; font-size: 13px; }
    main { padding: 16px; max-width: 720px; margin: 0 auto; }
    .notice {
      background: #fff8e8; border: 1px solid #f0d080; border-radius: 10px;
      padding: 12px 16px; margin-bottom: 20px; font-size: 13.5px;
    }
    .notice strong { color: var(--gold); }
    footer { text-align: center; padding: 20px; font-size: 12px; color: var(--sub); border-top: 1px solid var(--border); margin-top: 10px; }
    .quiz-section { background: var(--card); border: 2px solid var(--blue); border-radius: 12px; margin: 0 0 30px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
    .quiz-section-header { background: linear-gradient(135deg, #7b003d 0%, #e91e8c 100%); color: white; padding: 14px 16px; font-size: 16px; font-weight: bold; text-align: center; }
    .quiz-section-body { padding: 16px; }
    #quiz-start { text-align: center; padding: 10px 0 6px; }
    .start-btn { background: var(--blue); color: white; border: none; border-radius: 30px; padding: 14px 40px; font-size: 16px; font-weight: bold; cursor: pointer; letter-spacing: 1px; }
    .start-btn:hover { opacity: 0.88; }
    #quiz-body { display: none; }
    .q-progress-wrap { background: #e8edf2; border-radius: 10px; height: 6px; margin-bottom: 12px; overflow: hidden; }
    #q-progress { height: 100%; background: var(--blue); border-radius: 10px; transition: width 0.4s; width: 0%; }
    #q-num { font-size: 12px; color: var(--sub); text-align: right; margin-bottom: 8px; }
    #q-text { font-size: 15px; font-weight: bold; margin-bottom: 14px; line-height: 1.6; white-space: pre-line; }
    #q-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .q-opt { background: #f4f7fa; border: 2px solid var(--border); border-radius: 10px; padding: 11px 14px; font-size: 14px; text-align: left; cursor: pointer; transition: background 0.15s, border-color 0.15s; line-height: 1.5; }
    .q-opt:hover:not(:disabled) { background: #fff0f6; border-color: var(--blue); }
    .q-opt.correct { background: #e8f8e8; border-color: var(--green); color: var(--green); font-weight: bold; }
    .q-opt.wrong   { background: #fdecea; border-color: var(--red); color: var(--red); font-weight: bold; }
    .q-opt:disabled { cursor: default; }
    .q-hint { font-size: 13px; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; display: none; line-height: 1.6; }
    .correct-hint { background: #e8f8e8; color: var(--green); border-left: 3px solid var(--green); }
    .wrong-hint   { background: #fdecea; color: var(--red); border-left: 3px solid var(--red); }
    #q-next { display: none; width: 100%; background: var(--blue); color: white; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; }
    #q-next:hover { opacity: 0.88; }
    #quiz-result { display: none; text-align: center; padding: 10px 0 6px; }
    .result-circle { width: 110px; height: 110px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), #e91e8c); margin: 0 auto 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
    #result-score { font-size: 22px; font-weight: bold; }
    #result-pct   { font-size: 13px; opacity: 0.85; }
    #result-msg   { font-size: 16px; font-weight: bold; margin: 10px 0 16px; }
    .retry-btn { background: none; border: 2px solid var(--blue); color: var(--blue); border-radius: 30px; padding: 10px 30px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .retry-btn:hover { background: #fff0f6; }
    .pool-note { font-size: 12px; color: var(--sub); text-align: center; margin-top: 10px; }
  </style>
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src *.goatcounter.com; frame-ancestors 'none';">
</head>
<body>

<header>
  <div class="lesson-label">中学英語 Sirius 小テスト対策</div>
  <h1>小テスト練習50問</h1>
  <div class="topics">受動態全般／目的語と補語（毎回ランダム10問）</div>
</header>

<nav>
  <a href="sofukushu-9.html">📖 Unit9 受動態</a>
  <a href="sofukushu-10.html">📖 Unit10 能動態と受動態</a>
  <a href="sofukushu-12.html">📖 Unit12 目的語と補語</a>
</nav>

<main>

  <div class="notice">
    📢 <strong>使い方</strong>：全50問のプールから、挑戦するたびに<strong>ランダムで10問</strong>出題されます。何度でも挑戦して、いろいろな問題に慣れておこう！
  </div>

  <div class="quiz-section" id="quiz">
    <div class="quiz-section-body">
      <div id="quiz-start">
        <p style="font-size:13.5px; color:var(--sub); margin-bottom:14px;">受動態（現在・過去・否定・疑問・byを使わない表現）と目的語・補語（SVOO・SVOC）の総復習！ &#127919;</p>
        <button class="start-btn" onclick="startQuiz()">&#128640; ランダム10問スタート！</button>
        <div class="pool-note">全50問プールからランダム出題</div>
      </div>
      <div id="quiz-body">
        <div id="q-num"></div>
        <div class="q-progress-wrap"><div id="q-progress"></div></div>
        <div id="q-text"></div>
        <div id="q-options"></div>
        <div id="q-hint" class="q-hint"></div>
        <button id="q-next" onclick="nextQuestion()">次の問題へ →</button>
      </div>
      <div id="quiz-result">
        <div class="result-circle">
          <div id="result-score"></div>
          <div id="result-pct"></div>
        </div>
        <div id="result-msg"></div>
        <button class="retry-btn" onclick="startQuiz()">&#128260; もう一度（別の10問）</button>
      </div>
    </div>
  </div>

</main>

<footer>上野作　英語復習活用ホームページ｜小テスト練習50問</footer>

<script>
  // ===== 全50問のプール =====
  const questionPool = [
    { q: "This room ___ every morning.（そうじされる）", options: ["clean", "cleans", "is cleaned", "was cleaned"], answer: 2, hint: "受動態の基本形：is+過去分詞。" },
    { q: "These letters ___ in English.（書かれている）", options: ["write", "writes", "are written", "were written"], answer: 2, hint: "主語lettersは複数、現在の受動態。" },
    { q: "I ___ by everyone in my class.（好かれている）", options: ["like", "liked", "am liked", "was liked"], answer: 2, hint: "主語Iなのでam liked。" },
    { q: "This song ___ by many people.（歌われている）", options: ["sing", "sings", "is sung", "was sung"], answer: 2, hint: "singの過去分詞はsung。現在の受動態。" },
    { q: "This bridge ___ 100 years ago.（建てられた）", options: ["build", "built", "is built", "was built"], answer: 3, hint: "100 years agoは過去。受動態はwas built。" },
    { q: "These cakes ___ by my sister.（作られた）", options: ["make", "made", "were made", "are made"], answer: 2, hint: "cakesは複数、過去の受動態。" },
    { q: "The letter ___ last night.（書かれた）", options: ["write", "wrote", "was written", "is written"], answer: 2, hint: "last nightは過去。" },
    { q: "I ___ to the party yesterday.（招待された）", options: ["invite", "invited", "was invited", "am invited"], answer: 2, hint: "yesterdayは過去。" },
    { q: "This bag ___ made of leather.（革でできていない）", options: ["don't", "doesn't", "isn't", "wasn't"], answer: 2, hint: "現在の受動態の否定はbe+not。" },
    { q: "The door ___ locked last night.（ロックされていなかった）", options: ["isn't", "wasn't", "doesn't", "didn't"], answer: 1, hint: "last nightがあるので過去の否定。" },
    { q: "These books ___ read by young people.（読まれていない）", options: ["isn't", "aren't", "doesn't", "don't"], answer: 1, hint: "booksは複数、現在の否定。" },
    { q: "He ___ invited to the meeting.（招待されなかった）", options: ["isn't", "wasn't", "doesn't", "didn't"], answer: 1, hint: "過去の受動態の否定。" },
    { q: "___ this movie loved by children?（愛されていますか）", options: ["Do", "Does", "Is", "Are"], answer: 2, hint: "movieは単数、現在の受動態の疑問文。" },
    { q: "___ these shoes made in Japan?（作られていますか）", options: ["Do", "Is", "Are", "Does"], answer: 2, hint: "shoesは複数。" },
    { q: "___ the picture painted by a famous artist?（描かれたのですか）", options: ["Did", "Was", "Is", "Does"], answer: 1, hint: "過去の受動態の疑問文。" },
    { q: "___ the windows closed by your sister?（閉められたのですか）", options: ["Did", "Was", "Were", "Are"], answer: 2, hint: "windowsは複数、過去の疑問文。" },
    { q: "This picture was painted ___ Picasso.（ピカソによって）", options: ["of", "from", "by", "with"], answer: 2, hint: "行為者を表すのはby。" },
    { q: "My bike was fixed ___ my father.（父によって）", options: ["of", "for", "by", "with"], answer: 2, hint: "行為者はby。" },
    { q: "They speak Spanish in Mexico. を受動態に：Spanish ___ in Mexico.", options: ["speak", "speaks", "is spoken", "was spoken"], answer: 2, hint: "現在の一般的事実なのでis spoken。" },
    { q: "He wrote this novel. を受動態に：This novel ___ by him.", options: ["write", "wrote", "is written", "was written"], answer: 3, hint: "元の文が過去形writeなのでwas written。" },
    { q: "This ring is made ___ gold.（金でできている）", options: ["of", "from", "by", "with"], answer: 0, hint: "見た目そのままの材料はbe made of。" },
    { q: "Butter is made ___ milk.（牛乳から作られる）", options: ["of", "from", "by", "with"], answer: 1, hint: "性質が変わる材料はbe made from。" },
    { q: "The roof was covered ___ snow.（雪でおおわれていた）", options: ["of", "for", "with", "as"], answer: 2, hint: "be covered with「〜でおおわれている」。" },
    { q: "This town is known ___ its old temple.（お寺で知られている）", options: ["for", "as", "to", "with"], answer: 0, hint: "be known for「〜で知られている」（理由）。" },
    { q: "He is known ___ a strict teacher.（厳しい先生として）", options: ["for", "as", "to", "with"], answer: 1, hint: "be known as「〜として」。" },
    { q: "The song is known ___ people all over the world.（世界中の人々に）", options: ["for", "as", "to", "with"], answer: 2, hint: "be known to「〜に知られている」。" },
    { q: "This cup is made ___ glass.（ガラスでできている）", options: ["of", "from", "by", "with"], answer: 0, hint: "見た目そのままの材料はof。" },
    { q: "I am ___ in playing the guitar.（興味がある）", options: ["interesting", "interested", "interest", "interests"], answer: 1, hint: "be interested in「〜に興味がある」。" },
    { q: "We were ___ at the sudden noise.（驚いた）", options: ["surprising", "surprise", "surprised", "surprises"], answer: 2, hint: "be surprised at「〜に驚く」。" },
    { q: "My grandmother was ___ in Osaka.（生まれた）", options: ["bear", "born", "beared", "bore"], answer: 1, hint: "be born「生まれる」。" },
    { q: "I was ___ with his kindness.（感動した）", options: ["impressing", "impress", "impressed", "impresses"], answer: 2, hint: "be impressed with「〜に感動する」。" },
    { q: "The box was ___ with old toys.（いっぱいだった）", options: ["filling", "fill", "filled", "fills"], answer: 2, hint: "be filled with「〜でいっぱいだ」。" },
    { q: "The train was ___ with tourists.（混み合っていた）", options: ["crowding", "crowd", "crowded", "crowds"], answer: 2, hint: "be crowded with「〜で混み合っている」。" },
    { q: "My mother made me a cake. → My mother made a cake ___ me.", options: ["to", "for", "of", "at"], answer: 1, hint: "makeはfor型の動詞。" },
    { q: "He showed us some pictures. → He showed some pictures ___ us.", options: ["to", "for", "of", "at"], answer: 0, hint: "showはto型の動詞。" },
    { q: "She lent me her umbrella. → She lent her umbrella ___ me.", options: ["to", "for", "of", "at"], answer: 0, hint: "lendはto型の動詞。" },
    { q: "My uncle bought me a bike. → My uncle bought a bike ___ me.", options: ["to", "for", "of", "at"], answer: 1, hint: "buyはfor型の動詞。" },
    { q: "I gave my dog some water. → I gave some water ___ my dog.", options: ["to", "for", "of", "at"], answer: 0, hint: "giveはto型の動詞。" },
    { q: "I was given a nice present ___ my grandfather.（祖父によって）", options: ["of", "for", "by", "with"], answer: 2, hint: "SVOOの受動態でも行為者はby。" },
    { q: "This story was told to the children ___ their teacher.（先生によって）", options: ["of", "for", "by", "with"], answer: 2, hint: "行為者はby。" },
    { q: "It is ___ cold these days.（寒くなってきた）", options: ["getting", "gotten", "got", "gets"], answer: 0, hint: "get+形容詞「〜になる」。is getting で進行中の変化を表す。" },
    { q: "The leaves ___ red in autumn.（赤くなる）", options: ["turn", "turns", "turning", "turned"], answer: 0, hint: "leavesは複数、一般的な事実の現在形。" },
    { q: "This blanket ___ soft.（やわらかく感じる）", options: ["feel", "feels", "felt", "feeling"], answer: 1, hint: "主語は単数、feel+形容詞。" },
    { q: "His voice ___ strange today.（変に聞こえる）", options: ["sound", "sounds", "sounded", "sounding"], answer: 1, hint: "主語は単数、sound+形容詞。" },
    { q: "We ___ our cat Tama last year.（去年名づけた）", options: ["named", "said", "told", "spoke"], answer: 0, hint: "name+O+C（名前）「OをCと名づける」。" },
    { q: "His success made his parents ___.（誇りに思わせた）", options: ["proud", "proudly", "pride", "prouder"], answer: 0, hint: "make+O+C（形容詞）。" },
    { q: "Let's keep the room ___.（きれいにしておこう）", options: ["clean", "cleanly", "cleaned", "cleaning"], answer: 0, hint: "keep+O+C（形容詞）。" },
    { q: "They painted the fence ___.（白く塗った）", options: ["white", "whitely", "whiten", "whiteness"], answer: 0, hint: "paint+O+C（色の形容詞）。" },
    { q: "The movie made me ___.（悲しくさせた）", options: ["sadly", "sadness", "sad", "sadder"], answer: 2, hint: "make+O+C（形容詞）。" },
    { q: "My friends call me ___.（タローと呼ぶ）", options: ["Taro", "to Taro", "as Taro", "Taro's"], answer: 0, hint: "call+O+C（名前）に前置詞は不要。" }
  ];

  const QUIZ_SIZE = 10;
  let quizData = [];
  let current = 0, score = 0, answered = false;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startQuiz() {
    quizData = shuffle(questionPool).slice(0, QUIZ_SIZE);
    current = 0; score = 0; answered = false;
    document.getElementById('quiz-start').style.display = 'none';
    document.getElementById('quiz-body').style.display = 'block';
    document.getElementById('quiz-result').style.display = 'none';
    showQuestion();
  }
  function showQuestion() {
    answered = false;
    const q = quizData[current];
    document.getElementById('q-num').textContent = 'Q' + (current + 1) + ' / ' + quizData.length;
    document.getElementById('q-progress').style.width = ((current / quizData.length) * 100) + '%';
    document.getElementById('q-text').textContent = q.q;
    const opts = document.getElementById('q-options');
    opts.innerHTML = '';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'q-opt';
      btn.textContent = opt;
      btn.onclick = () => selectAnswer(i);
      opts.appendChild(btn);
    });
    document.getElementById('q-hint').style.display = 'none';
    document.getElementById('q-next').style.display = 'none';
  }
  function selectAnswer(i) {
    if (answered) return;
    answered = true;
    const q = quizData[current];
    const btns = document.querySelectorAll('.q-opt');
    btns.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.answer) btn.classList.add('correct');
      else if (idx === i) btn.classList.add('wrong');
    });
    if (i === q.answer) score++;
    const hint = document.getElementById('q-hint');
    hint.textContent = '\u{1F4A1} ' + q.hint;
    hint.style.display = 'block';
    hint.className = 'q-hint ' + (i === q.answer ? 'correct-hint' : 'wrong-hint');
    document.getElementById('q-next').style.display = 'block';
  }
  function nextQuestion() {
    current++;
    if (current >= quizData.length) showResult();
    else showQuestion();
  }
  function showResult() {
    document.getElementById('quiz-body').style.display = 'none';
    document.getElementById('quiz-result').style.display = 'block';
    const pct = Math.round((score / quizData.length) * 100);
    const msg = pct === 100 ? '\u{1F3C6} 満点！小テストもバッチリ！' :
                pct >= 70  ? '\u{1F389} よくできました！' :
                pct >= 40  ? '\u{1F4D6} もう一度解説を読もう！' :
                             '\u{1F4AA} 復習してから再チャレンジ！';
    document.getElementById('result-score').textContent = score + ' / ' + quizData.length;
    document.getElementById('result-pct').textContent = pct + '点';
    document.getElementById('result-msg').textContent = msg;
  }
</script>

<script data-goatcounter="https://ueno-english.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
