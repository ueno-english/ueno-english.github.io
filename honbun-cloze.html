// ── Speaker colors ──
const SPEAKERS = {
  "Carlos":    {color:"#1a6b3a", bg:"#e8f5ee"},
  "Yumi":      {color:"#0046a0", bg:"#e8f0fe"},
  "Mrs. Baker":{color:"#6b1a6b", bg:"#f5e8f5"},
  "Mr. Baker": {color:"#1a3a6b", bg:"#e8ecf5"},
  "Kevin":     {color:"#8b4500", bg:"#fdf0e8"},
  "Clark":     {color:"#1a6b6b", bg:"#e8f5f5"},
};

// ── State ──
let currentIdx = 0;
let revealed = 0;

// ── Helpers ──
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function parseEn(text){
  const parts=[];
  const re=/\{([^}]+)\}/g;
  let last=0, m;
  while((m=re.exec(text))!==null){
    if(m.index>last) parts.push({t:text.slice(last,m.index),b:false});
    parts.push({t:m[1],b:true});
    last=re.lastIndex;
  }
  if(last<text.length) parts.push({t:text.slice(last),b:false});
  return parts;
}

// ── Render lesson ──
function renderLesson(idx){
  currentIdx=idx; revealed=0;
  const lesson=LESSONS[idx];

  // Nav active
  document.querySelectorAll('.lesson-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));

  // Scene
  document.getElementById('sceneDesc').textContent=lesson.scene;

  // Count blanks
  let total=0;
  lesson.lines.forEach(l=>{ total+=parseEn(l.en).filter(s=>s.b).length; });
  document.getElementById('totalCount').textContent=total;
  document.getElementById('revealCount').textContent='0';

  // Build cards
  const area=document.getElementById('dialogueArea');
  area.innerHTML='';

  lesson.lines.forEach((line,li)=>{
    const sp=SPEAKERS[line.speaker]||{color:'#444',bg:'#f8f8f8'};
    const segs=parseEn(line.en);

    let enHtml='';
    segs.forEach((seg,si)=>{
      if(seg.b){
        const id=`b-${idx}-${li}-${si}`;
        const dashes='_'.repeat(Math.max(seg.t.length,3));
        enHtml+=`<span class="blank" id="${id}" data-word="${esc(seg.t)}" onclick="toggleBlank('${id}')">${dashes}</span>`;
      } else {
        enHtml+=esc(seg.t);
      }
    });

    const card=document.createElement('div');
    card.className='dialogue-line';
    card.innerHTML=`
      <div class="line-header" style="background:${sp.bg}">
        <div class="speaker-dot" style="background:${sp.color}"></div>
        <span class="speaker-name" style="color:${sp.color}">${esc(line.speaker)}</span>
      </div>
      <div class="line-body">
        <div class="line-en">${enHtml}</div>
        <div class="line-jp">${esc(line.jp)}</div>
      </div>`;
    area.appendChild(card);
  });
}

// ── Toggle blank ──
function toggleBlank(id){
  const el=document.getElementById(id);
  if(!el) return;
  const wasRev=el.classList.contains('revealed');
  if(!wasRev){
    el.textContent=el.dataset.word;
    el.classList.add('revealed');
    revealed++;
  } else {
    el.textContent='_'.repeat(Math.max(el.dataset.word.length,3));
    el.classList.remove('revealed');
    revealed--;
  }
  document.getElementById('revealCount').textContent=revealed;
}

// ── Reveal all ──
function revealAll(){
  document.querySelectorAll('.blank:not(.revealed)').forEach(el=>{
    el.textContent=el.dataset.word;
    el.classList.add('revealed');
    revealed++;
  });
  document.getElementById('revealCount').textContent=revealed;
}

// ── Reset all ──
function resetAll(){
  document.querySelectorAll('.blank.revealed').forEach(el=>{
    el.textContent='_'.repeat(Math.max(el.dataset.word.length,3));
    el.classList.remove('revealed');
  });
  revealed=0;
  document.getElementById('revealCount').textContent='0';
}

// ── Init nav ──
(function(){
  const nav=document.getElementById('lessonNav');
  LESSONS.forEach((l,i)=>{
    const btn=document.createElement('button');
    btn.className='lesson-btn'+(i===0?' active':'');
    btn.textContent=l.title;
    btn.onclick=()=>renderLesson(i);
    nav.appendChild(btn);
  });
  renderLesson(0);
