<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>実力テスト対策 大問2：文法・語彙</title>
  <style>
    :root { --blue:#b5006e; --blue2:#e91e8c; --red:#c0392b; --green:#1a7a1a; --gold:#d4700a; --bg:#fff0f6; --card:#ffffff; --border:#f5c6df; --text:#1a1a2e; --sub:#555; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Hiragino Sans","Meiryo",sans-serif; background:var(--bg); color:var(--text); font-size:15px; line-height:1.7; }
    header { background:linear-gradient(135deg,#7b003d 0%,var(--blue2) 60%,#ff6bb5 100%); color:white; padding:20px 20px 16px; text-align:center; }
    header .back-link { display:block; font-size:12px; color:rgba(255,255,255,.8); text-decoration:none; margin-bottom:8px; }
    header h1 { font-size:20px; font-weight:bold; margin-bottom:4px; }
    header .subtitle { font-size:12px; opacity:.85; background:rgba(255,255,255,.15); border-radius:20px; padding:3px 14px; display:inline-block; }
    main { max-width:720px; margin:0 auto; padding:20px 16px 40px; }
    .notice { background:#fff8e8; border:1px solid #f0d080; border-radius:10px; padding:12px 16px; margin-bottom:16px; font-size:13px; }
    .score-bar { background:white; border:2px solid var(--border); border-radius:12px; padding:12px 16px; text-align:center; margin-bottom:20px; }
    .score-bar .snum { font-size:30px; font-weight:bold; color:var(--blue); }
    .reset-btn { background:var(--blue); color:white; border:none; border-radius:8px; padding:7px 18px; font-size:13px; cursor:pointer; margin-left:12px; font-family:inherit; }
    .reset-btn:hover { background:var(--blue2); }
    .section-hd { background:var(--blue); color:white; padding:8px 14px; border-radius:8px 8px 0 0; font-weight:bold; font-size:14px; margin-top:24px; }
    .section-bd { background:white; border:1px solid var(--border); border-top:none; border-radius:0 0 8px 8px; padding:16px; }
    .instr { font-size:13px; color:var(--sub); margin-bottom:14px; border-left:3px solid var(--border); padding-left:10px; }
    .qbox { background:#fdf6fb; border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:12px; }
    .qtext { font-size:14px; margin-bottom:10px; line-height:1.7; }
    .blank { border-bottom:2px solid var(--blue); display:inline-block; min-width:60px; text-align:center; color:var(--sub); font-size:13px; padding:0 4px; }
    .choices { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .cbtn { background:white; border:2px solid var(--border); border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; text-align:left; font-family:inherit; transition:all .15s; }
    .cbtn:hover:not(:disabled) { border-color:var(--blue); background:var(--bg); }
    .cbtn.correct { background:#e8f8e8; border-color:var(--green); color:var(--green); font-weight:bold; }
    .cbtn.wrong { background:#fde8e8; border-color:var(--red); color:var(--red); }
    .cbtn.show-ok { background:#e8f8e8; border-color:var(--green); color:var(--green); }
    .feedback { font-size:13px; margin-top:8px; padding:8px 12px; border-radius:6px; display:none; }
    .feedback.ok { background:#e8f8e8; color:var(--green); }
    .feedback.ng { background:#fde8e8; color:var(--red); }
    .blank-q { background:#fdf6fb; border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:12px; }
    .jp { font-size:13px; color:var(--sub); margin-bottom:5px; }
    .en { font-size:14px; font-family:Georgia,serif; margin-bottom:8px; line-height:1.8; }
    .bk { border-bottom:2px solid var(--blue); display:inline-block; min-width:80px; color:var(--blue); font-style:italic; }
    .show-btn { background:var(--blue); color:white; border:none; border-radius:6px; padding:6px 16px; font-size:13px; cursor:pointer; font-family:inherit; }
    .show-btn:hover { background:var(--blue2); }
    .ans-box { display:none; margin-top:8px; background:#fff8e8; border:1px solid #f0d080; border-radius:6px; padding:8px 12px; font-size:13px; }
    .ans-box .al { font-weight:bold; color:var(--gold); margin-right:4px; }
    .grammar-note { font-size:12px; color:var(--sub); margin-top:3px; }
    .nav-btns { display:flex; gap:8px; margin-top:24px; flex-wrap:wrap; }
    .nav-btn { background:white; border:2px solid var(--border); border-radius:8px; padding:8px 16px; font-size:13px; text-decoration:none; color:var(--blue); font-weight:bold; }
    .nav-btn:hover { background:var(--bg); }
    footer { text-align:center; padding:20px; font-size:12px; color:var(--sub); border-top:1px solid var(--border); margin-top:40px; }
    @media(max-width:480px){ .choices{grid-template-columns:1fr;} }
  </style>
  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src *.goatcounter.com; frame-ancestors 'none';">
</head>
<body>
<header>
  <a class="back-link" href="index.html">← ホームに戻る</a>
  <h1>実力テスト対策 ｜ 大問２</h1>
  <div class="subtitle">文法・語彙（毎回ランダム出題）</div>
</header>
<main>
  <div class="notice">🎲 ページを開くたびに・「新しい問題」を押すたびに，問題と選択肢の順番が変わります！</div>

  <div class="score-bar">
    問1スコア：<span class="snum" id="snum">0</span><span style="font-size:18px;color:var(--sub)">/5</span>
    <button class="reset-btn" onclick="initAll()">🔀 新しい問題</button>
  </div>

  <div class="section-hd">問１　空所に入る最も適切なものを選びなさい</div>
  <div class="section-bd">
    <div class="instr">各文の（　）に入れるのにもっとも適切なものを①〜④のうちから一つずつ選びなさい。</div>
    <div id="grammar-container"></div>
  </div>

  <div class="section-hd" style="margin-top:28px;">問２　日本文の意味になるよう，空所に1語書きなさい</div>
  <div class="section-bd">
    <div class="instr">日本文の内容に合うように，英文の（　）に入る英語を1語考えなさい。</div>
    <div id="vocab-container"></div>
  </div>

  <div class="nav-btns">
    <a class="nav-btn" href="index.html">← ホーム</a>
    <a class="nav-btn" href="jitsuryoku-3.html">大問3 →</a>
  </div>
</main>
<footer>中学3年英語 New Treasure 学習サイト</footer>

<script>
const NUMS = ['①','②','③','④'];

const grammarBank = [
  {
    q: "My sister enjoys <span class='blank'>（　　）</span> music in her room every evening.",
    choices: [
      { t:"listen",    ok:false, note:"enjoy のあとは〜ing形（動名詞）が必要。enjoy to V は ✗" },
      { t:"to listen", ok:false, note:"enjoy to V という形はありません。" },
      { t:"listened",  ok:false, note:"過去形では文意に合いません。" },
      { t:"listening", ok:true,  note:"✅ enjoy ＋ 〜ing（動名詞）！" },
    ]
  },
  {
    q: "These old photos <span class='blank'>（　　）</span> taken at this park many years ago.",
    choices: [
      { t:"is",   ok:false, note:"主語 These old photos は複数なので is は使えません。" },
      { t:"are",  ok:false, note:"過去の出来事なので現在形 are は不適切です。" },
      { t:"was",  ok:false, note:"主語が複数（photos）なので was は使えません。" },
      { t:"were", ok:true,  note:"✅ 複数主語＋過去の受動態 → were taken！" },
    ]
  },
  {
    q: "A: <span class='blank'>（　　）</span> long have you been studying English? &nbsp; B: For about six years.",
    choices: [
      { t:"How",   ok:true,  note:"✅ How long ＋ 現在完了継続！「どのくらいの間〜していますか」" },
      { t:"What",  ok:false, note:"What long… という表現は存在しません。" },
      { t:"Where", ok:false, note:"Where long… という表現は存在しません。" },
      { t:"Which", ok:false, note:"Which long… という表現は存在しません。" },
    ]
  },
  {
    q: "Yuto has many books <span class='blank'>（　　）</span> before the exam.",
    choices: [
      { t:"study",    ok:false, note:"そのまま study では books を修飾できません。" },
      { t:"studied",  ok:false, note:"過去形では books を後ろから修飾できません。" },
      { t:"to study", ok:true,  note:"✅ 不定詞の形容詞的用法！ books to study ＝「勉強すべき本」" },
      { t:"studying", ok:false, note:"「今勉強中の本」という意味になり文意に合いません。" },
    ]
  },
  {
    q: "We were surprised <span class='blank'>（　　）</span> how fast she could run.",
    choices: [
      { t:"see",     ok:false, note:"be surprised のあとに動詞の原形は来ません。" },
      { t:"saw",     ok:false, note:"過去形 saw を直接続けることはできません。" },
      { t:"to see",  ok:true,  note:"✅ be surprised to V ＝「〜して驚く」感情の原因を表す不定詞！" },
      { t:"seeing",  ok:false, note:"be surprised seeing… という形はありません。" },
    ]
  },
  {
    q: "This letter <span class='blank'>（　　）</span> in English by Ms. Brown last week.",
    choices: [
      { t:"is written",  ok:false, note:"last week があるので過去形が必要です。" },
      { t:"was written", ok:true,  note:"✅ 過去の受動態！ last week なので was written が正解。" },
      { t:"wrote",       ok:false, note:"能動態では This letter が「書く」ことはできません。" },
      { t:"has written", ok:false, note:"last week（特定の過去）があると現在完了は使えません。" },
    ]
  },
  {
    q: "If it <span class='blank'>（　　）</span> tomorrow, we will stay home.",
    choices: [
      { t:"rain",      ok:false, note:"主語が it（3人称単数）なので rains が必要です。" },
      { t:"rains",     ok:true,  note:"✅ 条件節（If節）の中では未来のことでも現在形を使います！" },
      { t:"rained",    ok:false, note:"仮定法ではなく条件節なので過去形は不適切です。" },
      { t:"will rain", ok:false, note:"条件節（If節）の中では will を使いません。" },
    ]
  },
  {
    q: "My family <span class='blank'>（　　）</span> in this city for over twenty years.",
    choices: [
      { t:"live",      ok:false, note:"「ずっと〜している」継続の意味には現在完了が必要です。" },
      { t:"lived",     ok:false, note:"過去形だと「以前住んでいた（今は違う）」という意味になります。" },
      { t:"has lived", ok:true,  note:"✅ 現在完了継続形！「（今も）住み続けている」" },
      { t:"lives",     ok:false, note:"for over twenty years があるので現在完了が必要です。" },
    ]
  },
  {
    q: "A: <span class='blank'>（　　）</span> is your favorite subject at school? &nbsp; B: I like science the best.",
    choices: [
      { t:"What",  ok:true,  note:"✅ What で「何」を尋ねます！What is your favorite ~?「一番好きな〜は何ですか」" },
      { t:"How",   ok:false, note:"How は「どのように」を尋ねます。科目名を聞くには不適切です。" },
      { t:"Where", ok:false, note:"Where は「どこで」を尋ねます。" },
      { t:"Why",   ok:false, note:"Why は「なぜ」を尋ねます。" },
    ]
  },
  {
    q: "Ken <span class='blank'>（　　）</span> breakfast yet. He is still sleeping.",
    choices: [
      { t:"doesn't eat",  ok:false, note:"yet（まだ）があるので現在完了否定が適切です。" },
      { t:"didn't eat",   ok:false, note:"yet があるので過去形ではなく現在完了否定が適切です。" },
      { t:"hasn't eaten", ok:true,  note:"✅ 現在完了否定形！hasn't eaten yet「まだ食べていない」" },
      { t:"won't eat",    ok:false, note:"will の否定は未来の意志。「まだ食べていない」には合いません。" },
    ]
  },
  {
    q: "The story was so <span class='blank'>（　　）</span> that everyone in the class cried.",
    choices: [
      { t:"move",   ok:false, note:"形容詞として使う場合は moving または moved が必要です。" },
      { t:"moved",  ok:false, note:"moved は「（人が）感動した」。主語は story（物）なので moving が正しい。" },
      { t:"moving", ok:true,  note:"✅ moving ＝「感動的な」。物・事が主語のとき → 〜ing形を使います！" },
      { t:"moves",  ok:false, note:"動詞の moves ではなく形容詞として使う moving が正しいです。" },
    ]
  },
  {
    q: "It is very important for us <span class='blank'>（　　）</span> more about the environment.",
    choices: [
      { t:"know",    ok:false, note:"It is … for 人 to V の形なので，to をつける必要があります。" },
      { t:"knowing", ok:false, note:"動名詞ではなく不定詞（to ＋ 動詞原形）が必要です。" },
      { t:"knew",    ok:false, note:"過去形ではなく不定詞（to ＋ 動詞原形）が必要です。" },
      { t:"to know", ok:true,  note:"✅ It is … for 人 to V「人にとって〜することは…だ」の構文！" },
    ]
  },
];

const vocabBank = [
  { jp:"外国語を学ぶことは多くの子どもたちにとって楽しいです。",          en:"It is fun for many children to <span class='bk'>（　　　　）</span> a foreign language.",        ans:"learn",     note:"It is … for 人 to V の構文。learn「学ぶ」" },
  { jp:"その試合は2時間以上続きました。",                                   en:"The game <span class='bk'>（　　　　）</span> for more than two hours.",                            ans:"lasted",    note:"last「続く」は自動詞。過去形は lasted。" },
  { jp:"私の父は古いコインを集めています。",                               en:"My father <span class='bk'>（　　　　）</span> old coins.",                                        ans:"collects",  note:"主語が3人称単数なのでsを忘れずに。collect「集める」" },
  { jp:"ハルカは大勢の人の前で話すとき緊張します。",                       en:"Haruka feels <span class='bk'>（　　　　）</span> when she speaks in front of many people.",      ans:"nervous",   note:"feel nervous「緊張する」。形容詞 nervous は必須語彙！" },
  { jp:"わたしは自分の夢がいつかかなうと信じています。",                   en:"I <span class='bk'>（　　　　）</span> that my dream will come true someday.",                    ans:"believe",   note:"believe (that) SV「〜だと信じる」。hope や think でも可。" },
  { jp:"その知らせを聞いてとても驚きました。",                             en:"I was very <span class='bk'>（　　　　）</span> to hear the news.",                               ans:"surprised", note:"be surprised to V「〜して驚く」。surprised は形容詞。" },
  { jp:"私の兄は毎日放課後にギターを練習しています。",                     en:"My brother <span class='bk'>（　　　　）</span> the guitar every day after school.",             ans:"practices", note:"practice「練習する」。3人称単数現在なので s がつく。" },
  { jp:"あなたはその件についてすぐに決断するべきです。",                   en:"You should <span class='bk'>（　　　　）</span> about the matter soon.",                         ans:"decide",    note:"decide「決める・決断する」。should のあとは動詞の原形。" },
  { jp:"このバスはどこへ行きますか。",                                     en:"Where <span class='bk'>（　　　　）</span> this bus go?",                                         ans:"does",      note:"主語が3人称単数（this bus）の疑問文は does を使う。" },
  { jp:"私の弟は英語と数学の両方が得意です。",                             en:"My brother is good at <span class='bk'>（　　　　）</span> English and math.",                   ans:"both",      note:"both A and B「AもBも両方」という表現。" },
];

// ===== Core logic =====
let score = 0, qDone = {}, currentG = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function pick(arr, n) { return shuffle(arr).slice(0, n); }

function initAll() {
  score = 0; qDone = {};
  document.getElementById('snum').textContent = '0';

  // Grammar
  const gc = document.getElementById('grammar-container');
  gc.innerHTML = '';
  currentG = pick(grammarBank, 5).map(q => ({ ...q, sc: shuffle([...q.choices]) }));
  currentG.forEach((q, qi) => {
    const div = document.createElement('div');
    div.className = 'qbox';
    div.id = 'gq'+qi;
    div.innerHTML = `
      <div class="qtext">(${qi+1})　${q.q}</div>
      <div class="choices">
        ${q.sc.map((c,ci) => `<button class="cbtn" onclick="ansG(${qi},${ci})">${NUMS[ci]} ${c.t}</button>`).join('')}
      </div>
      <div class="feedback" id="gq${qi}-fb"></div>`;
    gc.appendChild(div);
  });

  // Vocab
  const vc = document.getElementById('vocab-container');
  vc.innerHTML = '';
  pick(vocabBank, 5).forEach((q, vi) => {
    const div = document.createElement('div');
    div.className = 'blank-q';
    div.innerHTML = `
      <div class="jp">(${vi+1}) ${q.jp}</div>
      <div class="en">${q.en}</div>
      <button class="show-btn" onclick="this.style.display='none';this.nextElementSibling.style.display='block'">答えを見る</button>
      <div class="ans-box"><span class="al">答え：</span><strong>${q.ans}</strong><div class="grammar-note">${q.note}</div></div>`;
    vc.appendChild(div);
  });
}

function ansG(qi, ci) {
  if (qDone['g'+qi]) return;
  qDone['g'+qi] = true;
  const box = document.getElementById('gq'+qi);
  const fb  = document.getElementById('gq'+qi+'-fb');
  const btns = box.querySelectorAll('.cbtn');
  const c = currentG[qi].sc[ci];
  btns.forEach(b => b.disabled = true);
  if (c.ok) {
    btns[ci].classList.add('correct');
    fb.textContent = c.note;
    fb.className = 'feedback ok';
    score++;
    document.getElementById('snum').textContent = score;
  } else {
    btns[ci].classList.add('wrong');
    currentG[qi].sc.forEach((ch,i) => { if(ch.ok) btns[i].classList.add('show-ok'); });
    fb.textContent = '❌ ' + c.note + ' → 緑のボタンが正解です。';
    fb.className = 'feedback ng';
  }
  fb.style.display = 'block';
}

initAll();
</script>
</body>
</html>
