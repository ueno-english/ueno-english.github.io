<main>

  <div class="notice">
    📢 <strong>使い方</strong>：中間テストと同じ形式の問題です。種類をえらんで、<strong>ランダムで最大10問</strong>出題されます。何度でも挑戦しよう！<br>
    ※ 並べかえ問題は、問題に書かれた番号のうち、<strong>3番目と5番目</strong>にくる語（句）の組み合わせをえらびます。
  </div>

  <div class="quiz-section" id="quiz">
    <div class="quiz-section-body">
      <div id="quiz-start">
        <p style="font-size:13.5px; color:var(--sub); margin-bottom:14px;">どの種類にチャレンジする？</p>
        <button class="start-btn" onclick="startQuiz('all')">&#128640; ミックス10問スタート！</button>
        <div class="cat-wrap">
          <button class="cat-btn" onclick="startQuiz('two')">2択問題</button>
          <button class="cat-btn" onclick="startQuiz('four')">4択問題</button>
          <button class="cat-btn" onclick="startQuiz('talk')">会話問題</button>
          <button class="cat-btn" onclick="startQuiz('order')">並べかえ</button>
          <button class="cat-btn" onclick="startQuiz('error')">誤り探し</button>
        </div>
        <div class="pool-note">全42問プールからランダム出題</div>
      </div>
      <div id="quiz-body">
        <div id="q-type" class="type-tag"></div>
        <div id="q-num"></div>
        <div class="q-progress-wrap"><div id="q-progress"></div></div>
        <div id="q-text"></div>
        <div id="q-options"></div>
        <div id="q-hint" class="q-hint"></div>
        <button id="q-next" onclick="nextQuestion()">次の問題へ →</button>
      </div>
      <div id="quiz-result">
        <div class="result-circle">
          <div id="result-score"></div>
          <div id="result-pct"></div>
        </div>
        <div id="result-msg"></div>
        <button class="retry-btn" onclick="restart()">&#128260; 種類をえらびなおす</button>
      </div>
    </div>
  </div>

</main>

  const TYPE_NAMES = { two: '2択問題', four: '4択問題', talk: '会話問題', order: '並べかえ', error: '誤り探し' };
  const QUIZ_SIZE = 10;
  let quizData = [], current = 0, score = 0, answered = false;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 誤り探し以外は選択肢の並びをシャッフルする（正解の番号もいっしょに動かす）
  function prepare(q) {
    if (q.type === 'error') return q;
    const idx = shuffle(q.options.map((_, i) => i));
    return {
      type: q.type, q: q.q, hint: q.hint,
      options: idx.map(i => q.options[i]),
      answer: idx.indexOf(q.answer)
    };
  }

  function startQuiz(type) {
    const pool = (type === 'all') ? questionPool : questionPool.filter(q => q.type === type);
    quizData = shuffle(pool).slice(0, QUIZ_SIZE).map(prepare);
    current = 0; score = 0; answered = false;
    document.getElementById('quiz-start').style.display = 'none';
    document.getElementById('quiz-body').style.display = 'block';
    document.getElementById('quiz-result').style.display = 'none';
    showQuestion();
  }
  function restart() {
    document.getElementById('quiz-result').style.display = 'none';
    document.getElementById('quiz-start').style.display = 'block';
  }
  function showQuestion() {
    answered = false;
    const q = quizData[current];
    document.getElementById('q-type').textContent = TYPE_NAMES[q.type];
    document.getElementById('q-num').textContent = 'Q' + (current + 1) + ' / ' + quizData.length;
    document.getElementById('q-progress').style.width = ((current / quizData.length) * 100) + '%';
    document.getElementById('q-text').textContent = q.q;
    const opts = document.getElementById('q-options');
    opts.innerHTML = '';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'q-opt';
      btn.textContent = opt;
      btn.onclick = () => selectAnswer(i);
      opts.appendChild(btn);
    });
    document.getElementById('q-hint').style.display = 'none';
    document.getElementById('q-next').style.display = 'none';
  }
  function selectAnswer(i) {
    if (answered) return;
    answered = true;
    const q = quizData[current];
    const btns = document.querySelectorAll('.q-opt');
    btns.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.answer) btn.classList.add('correct');
      else if (idx === i) btn.classList.add('wrong');
    });
    if (i === q.answer) score++;
    const hint = document.getElementById('q-hint');
    hint.textContent = '\u{1F4A1} ' + q.hint;
    hint.style.display = 'block';
    hint.className = 'q-hint ' + (i === q.answer ? 'correct-hint' : 'wrong-hint');
    document.getElementById('q-next').style.display = 'block';
  }
  function nextQuestion() {
    current++;
    if (current >= quizData.length) showResult();
    else showQuestion();
  }
  function showResult() {
    document.getElementById('quiz-body').style.display = 'none';
    document.getElementById('quiz-result').style.display = 'block';
    const pct = Math.round((score / quizData.length) * 100);
    const msg = pct === 100 ? '\u{1F3C6} 満点！中間テストもバッチリ！' :
                pct >= 70  ? '\u{1F389} よくできました！' :
                pct >= 40  ? '\u{1F4D6} もう一度解説を読もう！' :
                             '\u{1F4AA} 復習してから再チャレンジ！';
    document.getElementById('result-score').textContent = score + ' / ' + quizData.length;
    document.getElementById('result-pct').textContent = pct + '点';
    document.getElementById('result-msg').textContent = msg;
  }
</script>
